name: Manual SonarCloud Run

# NOTE: the steps below are still the Node/npm defaults and will fail on this
# Python project (there is no package.json). Port them to pip + pytest
# --cov-report=xml, and confirm SONAR_TOKEN is set, before relying on this.
# Manual dispatch only, so it never blocks CI in the meantime.

permissions:
  contents: read

on:
  workflow_dispatch: # Enables manual triggering

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so SonarCloud can assign issues/coverage to the right commits.
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Coverage
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
